<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岐阜県おすすめスポットガイド</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>岐阜県おすすめスポットガイド</h1>
        <p>私たちが厳選した岐阜県内の魅力的な場所を紹介します！</p>
    </header>

    <main>
        <h2>紹介スポット一覧</h2>
        
        <div class="spot-grid">
            <!-- Aさんの紹介スポット -->
            <article class="spot-card">
                <img src="images/spot-a.jpg" alt="スポットAの画像">
                <div class="spot-card-content">
                    <h3>【スポットAの名前】</h3>
                    <p>スポットAの短い説明をここに記述します。</p>
                    <a href="spot-a.html" class="btn-link">詳細を見る</a>
                </div>
            </article>

            <!-- Bさんの紹介スポット -->
            <article class="spot-card">
                <img src="images/spot-b.jpg" alt="スポットBの画像">
                <div class="spot-card-content">
                    <h3>【スポットBの名前】</h3>
                    <p>スポットBの短い説明をここに記述します。</p>
                    <a href="spot-b.html" class="btn-link">詳細を見る</a>
                </div>
            </article>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 岐阜スポット制作チーム</p>
    </footer>

</body>
</html>
